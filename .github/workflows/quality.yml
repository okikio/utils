name: Quality

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      fresh:
        description: Run lanes whose inputs already passed, and bypass native Deno compiler state, without changing selected checks
        type: boolean
        default: false

# Both callers execute this commit with a read-only token and no inherited secrets.
permissions:
  contents: read

jobs:
  plan:
    name: Select affected work
    permissions:
      # Main pushes read earlier CI runs to find the last commit that passed.
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.stack.outputs.selected }}
      projects: ${{ steps.plan.outputs.projects }}
      source: ${{ steps.plan.outputs.source }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
      browser: ${{ steps.plan.outputs.browser }}
      packages: ${{ steps.plan.outputs.packages }}
      postgres: ${{ steps.plan.outputs.postgres }}
      containers: ${{ steps.plan.outputs.containers }}
      interop: ${{ steps.plan.outputs.interop }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      docs: ${{ steps.plan.outputs.docs }}
      examples: ${{ steps.plan.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: true
      - name: Select the combined native stack candidate
        id: stack
        uses: $/.github/actions/stack
      # A main push selects work changed since the last commit whose CI passed, not since the
      # previous push, so a failed push stays selected until it passes. No baseline selects all work.
      - name: Find the last main commit whose CI passed
        id: baseline
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: node tools/workspace/evidence.ts baseline --head "$HEAD_SHA" --run-id "$RUN_ID"
      - uses: $/.github/actions/dependency-cache
        with:
          stores: pnpm deno
      - run: mise run prepare:node
      - id: plan
        env:
          BASE_SHA: ${{ steps.stack.outputs.base-sha || github.event.pull_request.base.sha || steps.baseline.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            mise run ci:plan -- --full
          else
            mise run ci:plan -- --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  source:
    needs: plan
    if: needs.plan.outputs.source == 'true'
    name: Source and public contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: source
          selection: ''
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      - name: Restore native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: restore
          cohort: utils-source
          bypass: ${{ inputs.fresh }}
      - run: mise run ci:run -- --lane source
        if: steps.passed.outputs.hit != 'true'
        env:
          # zizmor and pinact use the job token for their online audits; it only reads public data.
          GH_TOKEN: ${{ github.token }}
      - name: Save native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: save
          cohort: utils-source
          bypass: ${{ inputs.fresh }}
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: source
          selection: ''
          bypass: ${{ inputs.fresh }}

  runtimes:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.runtimes == 'true'
    name: Source on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, node, bun]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_RUNTIME: ${{ matrix.runtime }}
      CI_PROJECTS: ${{ needs.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: runtimes-${{ matrix.runtime }}
          selection: ${{ needs.plan.outputs.projects }}
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      - name: Restore native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: restore
          cohort: utils-runtime-${{ matrix.runtime }}
          bypass: ${{ inputs.fresh }}
      - run: mise run ci:run -- --lane runtimes --runtime "$TEST_RUNTIME" --projects-json "$CI_PROJECTS"
        if: steps.passed.outputs.hit != 'true'
      - name: Retain test reports
        if: steps.passed.outputs.hit != 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.runtime }}-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: save
          cohort: utils-runtime-${{ matrix.runtime }}
          bypass: ${{ inputs.fresh }}
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: runtimes-${{ matrix.runtime }}
          selection: ${{ needs.plan.outputs.projects }}
          bypass: ${{ inputs.fresh }}

  browser:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.browser == 'true'
    name: Native Chromium contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: browser
          selection: ''
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      # Browser revisions follow the installed Playwright version, not unrelated lockfile changes.
      - name: Identify native Playwright downloads
        if: steps.passed.outputs.hit != 'true'
        id: playwright
        continue-on-error: true
        run: |
          . /etc/os-release
          printf 'os=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import playwright from "playwright/package.json" with { type: "json" }; console.log("version=" + playwright.version)' >> "$GITHUB_OUTPUT"
      - name: Restore native Playwright downloads
        id: playwright-cache
        if: steps.passed.outputs.hit != 'true' && (steps.playwright.outputs.version != '' && steps.playwright.outputs.os != '')
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: utils-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: mise run ci:run -- --lane browser
        if: steps.passed.outputs.hit != 'true'
      # Cache downloads after fresh checks; PR writes remain in their merge-ref scope.
      - name: Save native Playwright downloads
        if: >-
          steps.passed.outputs.hit != 'true' && (success() && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-primary-key != '' && github.event.repository.fork == false && ( (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_protected == true)) || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Retain test reports
        if: steps.passed.outputs.hit != 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: browser
          selection: ''
          bypass: ${{ inputs.fresh }}

  packages:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.packages == 'true'
    name: Installed package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: packages
          selection: ''
          bypass: ${{ inputs.fresh || inputs.full }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      # Browser revisions follow the installed Playwright version, not unrelated lockfile changes.
      - name: Identify native Playwright downloads
        if: steps.passed.outputs.hit != 'true'
        id: playwright
        continue-on-error: true
        run: |
          . /etc/os-release
          printf 'os=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import playwright from "playwright/package.json" with { type: "json" }; console.log("version=" + playwright.version)' >> "$GITHUB_OUTPUT"
      - name: Restore native Playwright downloads
        id: playwright-cache
        if: steps.passed.outputs.hit != 'true' && (steps.playwright.outputs.version != '' && steps.playwright.outputs.os != '')
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: utils-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-all
      - run: mise run fixture:browser --with-deps
        if: steps.passed.outputs.hit != 'true'
      - run: mise run ci:run -- --lane packages
        if: steps.passed.outputs.hit != 'true'
      # Cache downloads after fresh checks; PR writes remain in their merge-ref scope.
      - name: Save native Playwright downloads
        if: >-
          steps.passed.outputs.hit != 'true' && (success() && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-primary-key != '' && github.event.repository.fork == false && ( (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_protected == true)) || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Retain test reports
        if: steps.passed.outputs.hit != 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain tested npm publication candidates
        if: steps.passed.outputs.hit != 'true' && (success() && inputs.full)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidates
          path: .tmp/artifacts/npm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: packages
          selection: ''
          bypass: ${{ inputs.fresh || inputs.full }}

  postgres:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.postgres == 'true'
    name: PostgreSQL queue and durable recovery (${{ matrix.shard }}/2)
    # The suite runs one file at a time against one database, so two jobs split its files.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job starts PostgreSQL itself instead of using a service container. A service is pulled
    # and started before any step, even when the result cache then skips the job.
    env:
      UTILS_TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/utils_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: postgres
          selection: shard=${{ matrix.shard }}/2
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      - name: Load the pinned container images
        id: images
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/image-cache
      - name: Start PostgreSQL
        if: steps.passed.outputs.hit != 'true'
        env:
          IMAGE: ${{ steps.images.outputs.postgres }}
        run: |
          set -euo pipefail
          docker run --detach --name postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=fixture --env POSTGRES_PASSWORD=fixture --env POSTGRES_DB=utils_test \
            --health-cmd 'pg_isready -U fixture -d utils_test' --health-interval 1s --health-retries 60 \
            "$IMAGE"
          for _ in $(seq 60); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' postgres)" == healthy ]] && exit 0
            sleep 1
          done
          docker logs postgres
          echo '::error::PostgreSQL did not become ready within 60 seconds.' >&2
          exit 1
      - run: mise run ci:run -- --lane postgres --shard "$SHARD/2"
        if: steps.passed.outputs.hit != 'true'
        env:
          SHARD: ${{ matrix.shard }}
      - name: Retain test reports
        if: steps.passed.outputs.hit != 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-reports-${{ matrix.shard }}
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: postgres
          selection: shard=${{ matrix.shard }}/2
          bypass: ${{ inputs.fresh }}

  # Each target × client cell has a key built from exactly what it runs (see tools/testing/interop/keys.ts). The plan
  # starts one job per target that has a cell no earlier run passed, holding only those clients, so an unchanged cell
  # never runs again and a target whose cells all passed starts no job. This replaces the whole-tree result cache for
  # this lane: a change to one client reruns that client's cells only.
  interop-plan:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.interop == 'true'
    name: Plan PostgreSQL interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the ledgers of passed cells that earlier runs uploaded; this job writes nothing.
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.interop }}
      renew: ${{ steps.plan.outputs.renew }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        with:
          stores: pnpm deno
      - run: mise run prepare:node
      - name: Read the cells earlier runs passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/testing/interop/cli.ts fetch --out .tmp/interop/ledgers
      - name: Choose the cells to run
        id: plan
        env:
          FRESH: ${{ inputs.fresh }}
        run: |
          args=()
          if [[ "$FRESH" == true ]]; then args+=(--fresh); fi
          node tools/testing/interop/cli.ts plan --ledgers .tmp/interop/ledgers --out .tmp/interop/plan.json "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-plan
          path: .tmp/interop/plan.json
          if-no-files-found: error
          retention-days: 1

  interop:
    needs: interop-plan
    if: needs.interop-plan.outputs.run == 'true'
    name: PostgreSQL interoperability (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.interop-plan.outputs.shards) }}
    env:
      INTEROP_TARGETS: ${{ matrix.target }}
      INTEROP_CLIENTS: ${{ matrix.clients }}
      # Docker Hub limits anonymous pulls; Google's mirror serves the same digests.
      INTEROP_MIRROR: mirror.gcr.io
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
      # Clients run against one server side by side, each in its own schema; a pooler's module asks for one at a time.
      INTEROP_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        with:
          stores: pnpm deno
      - run: mise run prepare:node
      # Pulling by digest from the mirror beat restoring `docker save` archives from the Actions cache for every image
      # measured, from 307 MiB (5 s against 6 s) to 2.4 GiB (27 s against 35 s), so images are not cached.
      - name: Run the stale clients against ${{ matrix.target }}
        id: interop
        run: mise run ci:run -- --lane interop
      - name: Record the cells that passed
        if: always() && steps.interop.outcome != 'skipped'
        run: node tools/testing/interop/cli.ts record --target "$INTEROP_TARGETS" --out ".tmp/interop/passed/$INTEROP_TARGETS.json"
      - if: always() && steps.interop.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-passed-${{ matrix.target }}
          path: .tmp/interop/passed/
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload the compatibility report
        if: always() && steps.interop.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-report-${{ matrix.target }}
          path: .tmp/tests/interop/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save dependency downloads after successful checks
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

  # Fold this run's passed cells into the ledger and upload it for 90 days. Pull request runs never upload one, and
  # the plan reads only ledgers from pushes and manual runs.
  interop-ledger:
    needs: [interop-plan, interop]
    if: always() && needs.interop-plan.result == 'success' && (needs.interop-plan.outputs.run == 'true' || needs.interop-plan.outputs.renew == 'true')
    name: Keep PostgreSQL interoperability results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: node
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interop-plan
          path: .tmp/interop
      # A renewal with nothing run has no passed cells to download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: interop-passed-*
          path: .tmp/interop/passed
          merge-multiple: true
      - run: node tools/testing/interop/cli.ts merge --base .tmp/interop/plan.json --passed .tmp/interop/passed --out .tmp/interop/ledger/ledger.json
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-ledger
          path: .tmp/interop/ledger/ledger.json
          if-no-files-found: error
          retention-days: 90

  containers:
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.containers == 'true'
    name: Container recovery (${{ matrix.shard }}/3)
    # The suite runs one file at a time against Docker, so three jobs split its files.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: containers
          selection: shard=${{ matrix.shard }}/3
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      - name: Load the pinned container images
        id: images
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/image-cache
      # Browser revisions follow the installed Playwright version, not unrelated lockfile changes.
      # Only the shard that runs a browser test restores or installs the engines.
      - name: Identify native Playwright downloads
        if: steps.passed.outputs.hit != 'true'
        id: playwright
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          . /etc/os-release
          {
            printf 'os=%s-%s\n' "$ID" "$VERSION_ID"
            node --input-type=module -e 'import playwright from "playwright/package.json" with { type: "json" }; console.log("version=" + playwright.version)'
            node --input-type=module -e '
              import { BrowserFiles, discover, shard } from "./tools/testing/discover.ts";
              const files = shard((await discover(process.cwd())).filter((file) => file.family === "containers"), Number(process.env.SHARD), 3);
              console.log("needed=" + files.some((file) => BrowserFiles.has(file.path)));
            '
          } >> "$GITHUB_OUTPUT"
      - name: Restore native Playwright downloads
        id: playwright-cache
        if: steps.passed.outputs.hit != 'true' && steps.playwright.outputs.needed == 'true' && (steps.playwright.outputs.version != '' && steps.playwright.outputs.os != '')
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: utils-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}-all
      - run: mise run ci:run -- --lane containers --shard "$SHARD/3"
        if: steps.passed.outputs.hit != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          RYUK_CONTAINER_IMAGE: ${{ steps.images.outputs.ryuk }}
      # Cache downloads after fresh checks; PR writes remain in their merge-ref scope.
      - name: Save native Playwright downloads
        if: >-
          steps.passed.outputs.hit != 'true' && steps.playwright.outputs.needed == 'true' && (success() && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-primary-key != '' && github.event.repository.fork == false && ( (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_protected == true)) || (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Retain test reports
        if: steps.passed.outputs.hit != 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-reports-${{ matrix.shard }}
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
            .tmp/tests/recovery/**/*.json
            .tmp/tests/recovery/**/*.log
            .tmp/tests/recovery/**/*.sql
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: containers
          selection: shard=${{ matrix.shard }}/3
          bypass: ${{ inputs.fresh }}

  benchmark:
    needs: plan
    # Both short pure task families reuse one locked installation and runner.
    if: needs.plan.outputs.selected == 'true' && (needs.plan.outputs.benchmark == 'true' || needs.plan.outputs.examples == 'true')
    name: Benchmark correctness and copyable examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: benchmark
          selection: benchmark=${{ needs.plan.outputs.benchmark }} examples=${{ needs.plan.outputs.examples }}
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - id: prepare
        if: steps.passed.outputs.hit != 'true'
        run: mise run prepare:node
      - name: Verify benchmark correctness
        if: steps.passed.outputs.hit != 'true' && (needs.plan.outputs.benchmark == 'true')
        run: mise run ci:run -- --lane benchmark
      # A failing task does not hide the other runtimes; any failure still fails this job.
      - name: Test copyable examples on Deno
        if: steps.passed.outputs.hit != 'true' && (!cancelled() && needs.plan.outputs.examples == 'true' && steps.prepare.outcome == 'success')
        run: mise run test:examples -- --runtime deno
      - name: Test copyable examples on Node
        if: steps.passed.outputs.hit != 'true' && (!cancelled() && needs.plan.outputs.examples == 'true' && steps.prepare.outcome == 'success')
        run: mise run test:examples -- --runtime node
      - name: Test copyable examples on Bun
        if: steps.passed.outputs.hit != 'true' && (!cancelled() && needs.plan.outputs.examples == 'true' && steps.prepare.outcome == 'success')
        run: mise run test:examples -- --runtime bun
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: benchmark
          selection: benchmark=${{ needs.plan.outputs.benchmark }} examples=${{ needs.plan.outputs.examples }}
          bypass: ${{ inputs.fresh }}

  advisory:
    name: Formatting and lint feedback
    needs: plan
    if: github.event_name != 'pull_request' && (needs.plan.outputs.source == 'true' || needs.plan.outputs.docs == 'true')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        kind: [format, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        with:
          stores: pnpm deno
      - run: mise run prepare:node
      - run: mise run "check:${{ matrix.kind }}"
      - name: Save dependency downloads after successful checks
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

  docs:
    name: Runnable documentation and bundles
    needs: plan
    if: needs.plan.outputs.selected == 'true' && needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skip the rest of this job when a trusted run already passed the same inputs.
      - name: Skip when these inputs already passed
        id: passed
        uses: $/.github/actions/result-cache
        with:
          mode: check
          lane: docs
          selection: ''
          bypass: ${{ inputs.fresh }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.passed.outputs.hit != 'true'
        with:
          version: 2026.11.12
          cache: true
      - uses: $/.github/actions/dependency-cache
        if: steps.passed.outputs.hit != 'true'
        with:
          stores: pnpm deno
      - run: mise run prepare:node
        if: steps.passed.outputs.hit != 'true'
      - name: Restore native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: restore
          cohort: utils-docs
          bypass: ${{ inputs.fresh }}
      - run: mise run ci:run -- --lane docs
        if: steps.passed.outputs.hit != 'true'
      - name: Save native Deno compiler state
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/deno-cache
        with:
          mode: save
          cohort: utils-docs
          bypass: ${{ inputs.fresh }}
      - name: Save dependency downloads after successful checks
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno

      - name: Record this pass for identical inputs
        if: steps.passed.outputs.hit != 'true'
        uses: $/.github/actions/result-cache
        with:
          mode: record
          lane: docs
          selection: ''
          bypass: ${{ inputs.fresh }}

  result:
    name: Required checks
    # Lower stack layers skip this aggregate; the selected top must prove its own combined checks.
    if: always() && (needs.plan.result != 'success' || needs.plan.outputs.selected != 'false')
    needs: [plan, source, runtimes, browser, packages, postgres, containers, interop-plan, interop, benchmark, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: node
          cache: true
      - name: Report selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node tools/workspace/ci/result.ts
