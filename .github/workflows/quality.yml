name: Quality

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

# Both callers execute this commit with a read-only token and no inherited secrets.
permissions:
  contents: read

jobs:
  plan:
    name: Select affected work
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      runtimes: ${{ steps.plan.outputs.runtimes }}
      browser: ${{ steps.plan.outputs.browser }}
      packages: ${{ steps.plan.outputs.packages }}
      postgres: ${{ steps.plan.outputs.postgres }}
      containers: ${{ steps.plan.outputs.containers }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
      docs: ${{ steps.plan.outputs.docs }}
      examples: ${{ steps.plan.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            mise run ci:plan -- --full
          else
            mise run ci:plan -- --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  source:
    needs: plan
    if: needs.plan.outputs.source == 'true'
    name: Source and public contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane source

  runtimes:
    needs: plan
    if: needs.plan.outputs.runtimes == 'true'
    name: Source on ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, node, bun]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane runtimes --runtime "$TEST_RUNTIME"
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.runtime }}-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    name: Native Chromium contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane browser
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  packages:
    needs: plan
    if: needs.plan.outputs.packages == 'true'
    name: Installed package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run prepare -- --kind browser --with-deps
      - run: mise run ci:run -- --lane packages
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain tested npm publication candidates
        if: success() && inputs.full
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidates
          path: .tmp/artifacts/npm/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  postgres:
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    name: PostgreSQL queue and durable recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: utils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d utils_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UTILS_TEST_DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/utils_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane postgres
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  containers:
    needs: plan
    if: needs.plan.outputs.containers == 'true'
    name: Container recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane containers
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-reports
          path: |
            .tmp/artifacts/tests/**/*.json
            .tmp/artifacts/tests/**/*.log
            .tmp/tests/**/*.json
            .tmp/tests/**/*.log
            .tmp/tests/recovery/**/*.json
            .tmp/tests/recovery/**/*.log
            .tmp/tests/recovery/**/*.sql
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    needs: plan
    if: needs.plan.outputs.benchmark == 'true'
    name: Benchmark correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane benchmark --check

  advisory:
    name: Formatting and lint feedback
    needs: plan
    if: needs.plan.outputs.source == 'true' || needs.plan.outputs.docs == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        kind: [format, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run check -- --kind "${{ matrix.kind }}"

  docs:
    name: Runnable documentation and bundles
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run ci:run -- --lane docs

  examples:
    name: Copyable examples on ${{ matrix.runtime }}
    needs: plan
    if: needs.plan.outputs.examples == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, node, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.10.3
          cache: true
      - id: stores
        run: |
          echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.stores.outputs.pnpm }}
            ${{ runner.temp }}/deno-cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run prepare -- --kind deps
      - run: mise run test -- --suite examples --runtime "${{ matrix.runtime }}"

  result:
    name: Required checks
    if: always()
    needs: [plan, source, runtimes, browser, packages, postgres, containers, benchmark, docs, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Report selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => ["failure", "cancelled"].includes(job.result))) process.exit(1);'
