name: Export preserved recovery patch 2

on:
  push:
    branches:
      - chatgpt/recover-audit-patch-20260905

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode preserved patch
        shell: bash
        run: |
          cat .github/recovery/patch.* | base64 --decode | gzip --decompress > okikio-utils-clean.patch
          test -s okikio-utils-clean.patch
          wc -l -c okikio-utils-clean.patch
      - uses: actions/upload-artifact@v4
        with:
          name: okikio-utils-preserved-audit-patch-2
          path: okikio-utils-clean.patch
          if-no-files-found: error
          retention-days: 1
