name: Recover four-week utility work

on:
  push:
    branches:
      - fix/four-week-recovery

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply preserved standards worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/main-standards-audit
          for part in 00 01 02 03; do
            git show "origin/fix/main-standards-audit:.github/recovery/patch.${part}" >> /tmp/recovery.b64
          done
          tr -d '\n\r' < /tmp/recovery.b64 | base64 --decode | gzip --decompress > /tmp/recovery.patch
          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          git rm .github/workflows/recover-four-week.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: recover preserved standards worktree'
          git push origin HEAD:fix/four-week-recovery
      - name: Archive recovered source
        uses: actions/upload-artifact@v4
        with:
          name: recovered-source
          include-hidden-files: true
          path: |
            .
            !.git
