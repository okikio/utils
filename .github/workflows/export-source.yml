name: Export source checkpoint

on:
  push:
    branches:
      - chatgpt/main-standards-continue-20260905

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source tree
        run: |
          rm .github/workflows/export-source.yml
          git archive --format=zip --output=okikio-utils-main.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: okikio-utils-main-source
          path: okikio-utils-main.zip
          if-no-files-found: error
          retention-days: 1
