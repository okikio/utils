name: Release

on:
  push:
    branches: [main]

concurrency:
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Bumpy
        run: npm install --ignore-scripts --workspaces=false
      - id: plan
        run: npx bumpy ci plan
        env:
          GH_TOKEN: ${{ github.token }}

  version-pr:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Bumpy
        run: npm install --ignore-scripts --workspaces=false
      - name: Create or update Bumpy version PR
        run: npx bumpy ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
      - name: Synchronize JSR versions into the generated release commit
        shell: bash
        env:
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${BUMPY_GH_TOKEN:-$GITHUB_TOKEN}"
          git checkout bumpy/version-packages
          node .bumpy/sync-deno-versions.mjs
          git add 'packages/*/deno.json' 'packages/*/deno.jsonc'
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
            gh auth setup-git
            git push --force-with-lease origin bumpy/version-packages
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install release tooling
        run: npm install --ignore-scripts --workspaces=false
      - name: Verify release source
        run: |
          npm run audit
          npm run release:test
          npm run release:versions
          deno task verify
      - name: Publish versioned packages to JSR
        run: npx bumpy ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
