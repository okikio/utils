name: CI

on:
  pull_request:
    # Only documented activity types. A PR that joins a native stack later is reselected on its next push.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: Run every selected lane even if the same inputs passed, and rebuild Deno compiler state
        type: boolean
        default: false

permissions:
  contents: read
  # The Quality plan job reads native stack membership.
  pull-requests: read

concurrency:
  # Ordinary manual checks share their exact source; fresh attempts stay
  # independent. PR revisions cannot interrupt either manual request.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, inputs.fresh && format('{0}-{1}', github.run_id, github.run_attempt) || 'reuse') || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
  queue: single

jobs:
  quality:
    name: Quality
    uses: $/.github/workflows/quality.yml
    with:
      fresh: ${{ inputs.fresh || false }}

  changesets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          cache: true
      - uses: ./.github/actions/dependency-cache
        with:
          stores: pnpm deno
      - run: mise run prepare:node
      - run: mise run release -- --operation plan
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save dependency downloads after successful changeset checks
        uses: ./.github/actions/dependency-cache
        with:
          mode: save
          stores: pnpm deno
