name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install root release tooling
        run: npm install --ignore-scripts --workspaces=false
      - name: Audit workspace and release contracts
        run: npm run audit
      - name: Test release tooling
        run: npm run release:test
      - name: Check manifest version parity
        run: npm run release:versions
      - name: Check, lint, and test Deno workspace
        run: deno task verify

  bumpy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Bumpy
        run: npm install --ignore-scripts --workspaces=false
      - name: Validate release declaration
        run: npx bumpy ci check --strict
        env:
          GH_TOKEN: ${{ github.token }}
