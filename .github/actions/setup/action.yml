name: Prepare locked workspace
description: Install pinned tools and frozen dependencies with reusable download stores
inputs:
  browser:
    description: Install Chromium and its Linux dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.10.3
        cache: true
    - id: stores
      shell: bash
      run: |
        echo "pnpm=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.stores.outputs.pnpm }}
          ${{ runner.temp }}/deno-cache
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml', 'deno.lock') }}
    - shell: bash
      run: mise run prepare -- --kind deps
    - if: inputs.browser == 'true'
      shell: bash
      run: mise run prepare -- --kind browser --with-deps
