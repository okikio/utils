name: Deno compiler state
description: >-
  Restore or save Deno's compiler state for one group of jobs (a cohort). The state is
  Deno's module analysis, type-check and code caches and its emitted code, kept apart
  from dependency downloads (../dependency-cache). Deno still type-checks the current
  source and runs every selected command, so a restored state can make a check faster but
  can never make it pass. Call it with mode restore before the checks and mode save
  after them. Set bypass to true (the fresh input of CI and Release) to skip both.

inputs:
  mode:
    description: restore (before the checks) or save (after successful checks)
    required: true
  cohort:
    description: Name of the job group whose source and commands share this state, for example utils-source
    required: true
  bypass:
    description: When 'true', neither restore nor save, so the job rebuilds compiler state from nothing
    default: 'false'

runs:
  using: composite
  steps:
    - name: Locate compiler state
      if: inputs.bypass != 'true'
      id: locate
      shell: bash
      env:
        COHORT: ${{ inputs.cohort }}
      run: |
        set -euo pipefail
        # dependency-cache sets DENO_DIR for the job; keep the same default if it did not run.
        deno_dir="${DENO_DIR:-$RUNNER_TEMP/deno-cache}"
        echo "DENO_DIR=$deno_dir" >> "$GITHUB_ENV"
        version=$(mise exec -- deno --version | head -n 1 | cut -d ' ' -f 2)
        {
          echo 'paths<<EOF'
          echo "$deno_dir/gen"
          # Deno's SQLite caches: check, fast check, module, Node and V8 code analysis.
          echo "$deno_dir/*_cache_v2*"
          echo 'EOF'
          # Compiler output depends on the Deno release and the lockfile, not on unrelated tools.
          echo "prefix=deno-state-v1-${RUNNER_OS}-${RUNNER_ARCH}-${version}-${COHORT}-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore compiler state
      id: restore
      if: inputs.bypass != 'true' && inputs.mode == 'restore'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.locate.outputs.paths }}
        # Each revision saves its own entry; restore takes the newest entry for this lockfile first.
        key: ${{ steps.locate.outputs.prefix }}${{ hashFiles('deno.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.locate.outputs.prefix }}${{ hashFiles('deno.lock') }}-
          ${{ steps.locate.outputs.prefix }}

    # Same trusted-ref rule as dependency-cache: forks never write, and a PR write stays in its merge-ref scope.
    - name: Save compiler state
      if: >-
        inputs.bypass != 'true' && inputs.mode == 'save' &&
        github.event.repository.fork == false &&
        (
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_protected == true)) ||
          (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge') &&
           github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
        )
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.locate.outputs.paths }}
        key: ${{ steps.locate.outputs.prefix }}${{ hashFiles('deno.lock') }}-${{ github.sha }}
