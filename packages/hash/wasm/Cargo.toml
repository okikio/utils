# One WebAssembly module per hash family. `abi` owns the exported functions and memory;
# each family crate only maps algorithm ids to maintained hash crates.
[workspace]
resolver = "3"
members = ["abi", "sha2", "sha3", "blake", "legacy", "national", "contest", "fsb", "mac", "fast", "checksum"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
abi = { path = "abi" }
digest = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha3 = { version = "0.12", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
blake3 = { version = "1.8", default-features = false, features = ["wasm32_simd", "zeroize"] }
k12 = { version = "0.5", default-features = false, features = ["zeroize"] }
shake = { version = "0.1", default-features = false, features = ["zeroize"] }
cshake = { version = "0.2", default-features = false, features = ["zeroize"] }
turboshake = { version = "0.7", default-features = false, features = ["zeroize"] }
md2 = { version = "0.11", default-features = false, features = ["zeroize"] }
md4 = { version = "0.11", default-features = false, features = ["zeroize"] }
md-5 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha1-checked = { version = "0.11.0-rc.0", default-features = false, features = ["zeroize"] }
ripemd = { version = "0.2", default-features = false, features = ["zeroize"] }
tiger = { version = "0.3", default-features = false, features = ["zeroize"] }
streebog = { version = "0.11", default-features = false, features = ["zeroize"] }
gost94 = { version = "0.11", default-features = false, features = ["zeroize"] }
sm3 = { version = "0.5", default-features = false, features = ["zeroize"] }
kupyna = { version = "0.1", default-features = false, features = ["zeroize"] }
belt-hash = { version = "0.2", default-features = false, features = ["zeroize"] }
bash-hash = { version = "0.1", default-features = false, features = ["zeroize"] }
ascon-hash = { version = "0.4", default-features = false, features = ["zeroize"] }
groestl = { version = "0.11", default-features = false, features = ["zeroize"] }
jh = { version = "0.2", default-features = false, features = ["zeroize"] }
skein = { version = "0.2", default-features = false, features = ["zeroize"] }
shabal = { version = "0.5", default-features = false, features = ["zeroize"] }
whirlpool = { version = "0.11", default-features = false, features = ["zeroize"] }
fsb = { version = "0.2", default-features = false, features = ["zeroize"] }
poly1305 = { version = "0.9", default-features = false, features = ["zeroize"] }
polyval = { version = "0.7", default-features = false, features = ["zeroize"] }
ghash = { version = "0.6", default-features = false, features = ["zeroize"] }
universal-hash = { version = "0.6", default-features = false }
siphasher = { version = "1", default-features = false }
highway = { version = "1", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32", "xxh64", "xxh3"] }
rapidhash = { version = "4", default-features = false }
wyhash = { version = "0.6", default-features = false }
murmur3 = { version = "0.5", default-features = false }
metrohash = { version = "1", default-features = false }
cityhasher = { version = "0.1", default-features = false }
seahash = { version = "4", default-features = false }
fnv = { version = "1", default-features = false }
crc = { version = "3", default-features = false }
crc32fast = { version = "1", default-features = false }
adler2 = { version = "2", default-features = false }
fletcher = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"

# SHA-1 and SHA-2 lose 2-3x when built for size (docs/hash/04-measurements.md), so speed is the default.
# Families that measured the same speed at both levels build for size below.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false


[profile.release.package.hash-blake]
opt-level = "s"
[profile.release.package.blake2]
opt-level = "s"
[profile.release.package.blake3]
opt-level = "s"
