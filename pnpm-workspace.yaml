packages:
  - 'packages/*'
  - 'examples/*'
  - 'tools'
  - 'tests/interop'

allowBuilds:
  # Docker's SSH transport can use its JavaScript fallback; no native compiler is needed.
  cpu-features: false
  ssh2: false
  # This install script only prints dependency-version advice; distributed code is already built.
  protobufjs: false
  # The interop suite only generates a Prisma client for raw SQL; it needs no downloaded engine.
  '@prisma/engines': false
  prisma: false

# Keep LogTape and the selected SDK family on the API version their peer ranges support.
minimumReleaseAgeExclude:
  - '@electric-sql/pglite@0.6.0'
  - '@electric-sql/pglite-age@0.1.0'
  - '@electric-sql/pglite-pg_hashids@0.1.0'
  - '@electric-sql/pglite-pg_ivm@0.1.0'
  - '@electric-sql/pglite-pg_textsearch@0.1.0'
  - '@electric-sql/pglite-pg_uuidv7@0.1.0'
  - '@electric-sql/pglite-pgtap@0.1.0'
  - '@electric-sql/pglite-pgvector@0.1.0'
  - '@electric-sql/pglite-socket@0.3.0'

overrides:
  '@opentelemetry/api': '1.10.0'
  # @logtape/otel 2.4.2 needs the 0.208 logs packages (0.223 drops NOOP_LOGGER), and they pin
  # @opentelemetry/core 2.2.0 (GHSA-8988-4f7v-96qf). Core and resources are stable 2.x packages,
  # so only those two move to the release the telemetry package selects.
  '@opentelemetry/core@2.2.0': '2.12.1'
  '@opentelemetry/resources@2.2.0': '2.12.1'
  # testcontainers 12.2 still uses archiver 7, whose glob and minimatch have advisories
  # (GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249). Both newer majors keep the CommonJS API it calls.
  'archiver-utils>glob': '^14.0.6'
  'glob>minimatch': '^11.0.9'
