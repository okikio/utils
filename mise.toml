min_version = "2026.11.12"

# Task families are the common local/CI interface. Helpers live under tools/;
# package source and tests keep their own runtime and resource contracts.
[settings]
task.output = "keep-order"
jobs = 4

[tools]
bun = "1.4.5"
deno = "2.9.8"
node = "26.13.1"
pnpm = "12.21.0"

# Check tools. Mise installs each lazy tool the first time a task runs its command,
# so a contributor who never runs that check never downloads it.
act = { version = "0.2.98", lazy = true }
yq = { version = "4.54.3", lazy = true }
gitleaks = { version = "8.30.1", lazy = true }
jactionlint = { version = "2.6.0", lazy = true }
osv-scanner = { version = "2.7.1", lazy = true }
pinact = { version = "5.0.2", lazy = true }
shellcheck = { version = "0.11.0", lazy = true }
zizmor = { version = "1.32.0", lazy = true }

[tasks."prepare"]
description = "Install the declared workspace dependencies"
depends = ["prepare:node"]

[tasks."check"]
description = "Check source contracts, package owners and repository workflows"
depends = ["check:**"]

[tasks."test"]
description = "Run source tests with the Deno host; other native hosts are test:node and test:bun"
raw_args = true
run = "node tools/testing/run.ts deno"

[tasks."bench"]
description = "Measure native workloads; package filtering belongs to package manifests"
depends = ["fixture:bench"]
raw_args = true
run = "deno run --frozen -A tools/bench/measure.ts"

[tasks."test:packages"]
description = "Build and verify clean installed npm artifacts across supported hosts"
run = ["mise run test:npm", "mise run test:consumer", "mise run test:browser:artifact"]

[tasks."build"]
description = "Build all npm ESM and declarations; use native package filters for selected owners"
depends = ["build:npm"]

[tasks."build:wasm"]
description = "Build or verify committed Rust/Wasm modules with explicit owner arguments"
raw_args = true
run = "node tools/packages/wasm.ts"

[tasks."verify"]
description = "Check source, portable runtimes and supported installed consumers"
run = [
  "mise run check",
  "mise run test:deno",
  "mise run test:comparisons -- deno",
  "mise run test:examples -- --runtime deno",
  "mise run test:node",
  "mise run test:comparisons -- node",
  "mise run test:examples -- --runtime node",
  "mise run test:bun",
  "mise run test:comparisons -- bun",
  "mise run test:examples -- --runtime bun",
  "mise run test:docs",
  "mise run test:bundles",
  "mise run test:npm",
  "mise run test:consumer",
  "mise run test:browser:artifact",
  "mise run check:jsr",
]

[tasks."release"]
description = "Preview the Sampo release plan without changing versions"
run = "node tools/releases/plan.ts"

[tasks."release:add"]
description = "Record a changeset with native Sampo package selection"
raw_args = true
run = "pnpm exec sampo add"

[tasks."release:version"]
description = "Prepare Sampo versions and project them into Deno manifests"
run = "node tools/releases/plan.ts --write"

[tasks."release:publish"]
description = "Publish one explicit registry target, or inspect it with --check"
raw_args = true
run = "node tools/releases/publish.ts"

[tasks."ci:plan"]
description = "Select CI lanes from exact Git revisions and pnpm's native dependency graph"
raw_args = true
run = "node tools/workspace/ci/plan.ts"

[tasks."ci:run"]
description = "Execute one admitted CI lane through native package and task owners"
raw_args = true
run = "node tools/workspace/ci/execute.ts"
